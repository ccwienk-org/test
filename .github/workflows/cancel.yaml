name: Workflow for testing on-cancel

on:
  push:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: wait and cancel
        shell: bash
        run: |
          onint() {
            touch /tmp/markerfile
          }

          trap onint SIGINT

          docker run alpine sleep 10
          # check whether signal is correctly picked up by toplevel trap if waiting for subprocess
        env:
          GH_TOKEN: ${{ github.token }}
      - name: run-if-cancelled
        if: cancelled()
        shell: bash
        run: |
          echo we were cancelled, alas!
          echo ls /tmp
          ls /tmp
