name: Workflow for testing on-cancel

on:
  push:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: wait and cancel
        shell: python
        run: |
          import signal
          import time

          def handle(signum, frame):
            print(f'received: {signum=}')
            with open('/tmp/markerfile', 'w') as f:
              f.write('bla')

          signal.signal(signal.SIGINT, handle)
          signal.signal(signal.SIGTERM, handle)

          time.sleep(60)
        env:
          GH_TOKEN: ${{ github.token }}
      - name: run-if-cancelled
        if: cancelled()
        shell: bash
        run: |
          echo we were cancelled, alas!
          echo ls /tmp
          ls /tmp
