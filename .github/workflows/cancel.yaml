name: Workflow for testing on-cancel

on:
  push:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: wait and cancel
        shell: bash
        run: |
          echo will wait for 20s, then cancel
          sleep 20
          echo self-cancelling now
          on_sigint() {
            echo uh-oh, we got a sigint
            exit 1
          }
          trap on_sigint SIGINT
          gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: run-if-cancelled
        if: cancelled()
        shell: bash
        run: |
          echo we were cancelled, alas!
