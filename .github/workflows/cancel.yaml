name: Self-Cancelling Workflow

on:
  push:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: cancel self
        shell: bash
        run: |
          gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
