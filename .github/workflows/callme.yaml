name: Reusable Test-Workflow

on:
  workflow_call:
    inputs:
      env:
        type: environment


jobs:
  test-env:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - name: test
        shell: bash
        run: |
          echo "env-var: ${{ vars.ENV_VAR }}, secret: ${{ secrets.SUPER_SECRET }}"
